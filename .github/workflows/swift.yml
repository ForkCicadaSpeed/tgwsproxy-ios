# Lightweight syntax/type-check job for the iOS sources.
# Real iOS builds happen in `build-ios.yml` (and the full release pipeline in
# `build.yml`). This workflow just runs `swiftc -typecheck` against the iOS
# SDK so type-only regressions are caught quickly on PRs.

name: Swift typecheck (iOS)

on:
  push:
    branches: ["main"]
    paths:
      - 'ios-app/**'
      - '.github/workflows/swift.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'ios-app/**'
      - '.github/workflows/swift.yml'

jobs:
  typecheck:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Typecheck main app sources
        working-directory: ios-app
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          MAIN_SOURCES=(
            TgWsProxy/Sources/TgWsProxyApp.swift
            TgWsProxy/Sources/ContentView.swift
            TgWsProxy/Sources/SettingsView.swift
            TgWsProxy/Sources/ProxyConfig.swift
            TgWsProxy/Sources/ProxyStats.swift
            TgWsProxy/Sources/ProxyManager.swift
            TgWsProxy/Sources/Crypto.swift
            TgWsProxy/Sources/RawWebSocket.swift
            TgWsProxy/Sources/MTProtoHandshake.swift
            TgWsProxy/Sources/MTProtoProxyServer.swift
            TgWsProxy/Sources/LiveActivityManager.swift
          )

          swiftc -typecheck \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -module-name TgWsProxy \
            "${MAIN_SOURCES[@]}"

      - name: Typecheck PacketTunnel extension sources
        working-directory: ios-app
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc -typecheck \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -module-name TgWsProxyTunnel \
            TgWsProxy/Tunnel/PacketTunnelProvider.swift \
            TgWsProxy/Tunnel/TunnelMain.swift \
            TgWsProxy/Sources/ProxyConfig.swift \
            TgWsProxy/Sources/ProxyStats.swift \
            TgWsProxy/Sources/Crypto.swift \
            TgWsProxy/Sources/RawWebSocket.swift \
            TgWsProxy/Sources/MTProtoHandshake.swift \
            TgWsProxy/Sources/MTProtoProxyServer.swift

      - name: Typecheck LiveActivity extension sources
        working-directory: ios-app
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc -typecheck \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -module-name TgWsProxyLiveActivity \
            TgWsProxy/Sources/LiveActivityManager.swift \
            TgWsProxy/LiveActivity/ProxyLiveActivity.swift
