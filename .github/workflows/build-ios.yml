name: Build TgWsProxy iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Find iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "Using SDK: $SDK"
          swift --version
          xcodebuild -version

      - name: Compile main app
        working-directory: ios-app
        run: |
          set -euo pipefail
          mkdir -p build/Payload/TgWsProxy.app

          SOURCES=(
            TgWsProxy/Sources/TgWsProxyApp.swift
            TgWsProxy/Sources/ContentView.swift
            TgWsProxy/Sources/SettingsView.swift
            TgWsProxy/Sources/ProxyConfig.swift
            TgWsProxy/Sources/ProxyStats.swift
            TgWsProxy/Sources/ProxyManager.swift
            TgWsProxy/Sources/Crypto.swift
            TgWsProxy/Sources/RawWebSocket.swift
            TgWsProxy/Sources/MTProtoHandshake.swift
            TgWsProxy/Sources/MTProtoProxyServer.swift
            TgWsProxy/Sources/LiveActivityManager.swift
          )

          echo "Compiling ${#SOURCES[@]} Swift files..."

          swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -module-name TgWsProxy \
            -emit-executable \
            -o build/Payload/TgWsProxy.app/TgWsProxy \
            -framework Foundation \
            -framework SwiftUI \
            -framework UIKit \
            -framework Network \
            -framework NetworkExtension \
            -framework ActivityKit \
            -framework WidgetKit \
            "${SOURCES[@]}"

          strip -x build/Payload/TgWsProxy.app/TgWsProxy
          echo "Main app compiled successfully."

      - name: Compile LiveActivity extension
        working-directory: ios-app
        run: |
          set -euo pipefail
          EXTENSION_DIR="build/Payload/TgWsProxy.app/PlugIns/TgWsProxyLiveActivity.appex"
          mkdir -p "$EXTENSION_DIR"

          swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -module-name TgWsProxyLiveActivity \
            -emit-executable \
            -o "$EXTENSION_DIR/TgWsProxyLiveActivity" \
            -framework Foundation \
            -framework SwiftUI \
            -framework WidgetKit \
            -framework ActivityKit \
            TgWsProxy/Sources/LiveActivityManager.swift \
            TgWsProxy/LiveActivity/ProxyLiveActivity.swift

          strip -x "$EXTENSION_DIR/TgWsProxyLiveActivity" 2>/dev/null || true
          cp TgWsProxy/LiveActivity/Info.plist "$EXTENSION_DIR/Info.plist"
          echo "LiveActivity extension compiled successfully."

      - name: Compile PacketTunnel extension
        working-directory: ios-app
        run: |
          set -euo pipefail
          TUNNEL_DIR="build/Payload/TgWsProxy.app/PlugIns/TgWsProxyTunnel.appex"
          mkdir -p "$TUNNEL_DIR"

          # Shared sources needed by the tunnel extension
          SHARED=(
            TgWsProxy/Sources/ProxyConfig.swift
            TgWsProxy/Sources/ProxyStats.swift
            TgWsProxy/Sources/Crypto.swift
            TgWsProxy/Sources/RawWebSocket.swift
            TgWsProxy/Sources/MTProtoHandshake.swift
            TgWsProxy/Sources/MTProtoProxyServer.swift
          )

          swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -module-name TgWsProxyTunnel \
            -emit-executable \
            -o "$TUNNEL_DIR/TgWsProxyTunnel" \
            -framework Foundation \
            -framework NetworkExtension \
            -framework Network \
            -framework Security \
            TgWsProxy/Tunnel/PacketTunnelProvider.swift \
            TgWsProxy/Tunnel/TunnelMain.swift \
            "${SHARED[@]}"

          strip -x "$TUNNEL_DIR/TgWsProxyTunnel" 2>/dev/null || true
          cp TgWsProxy/Tunnel/Info.plist "$TUNNEL_DIR/Info.plist"
          cp TgWsProxy/Tunnel/TgWsProxyTunnel.entitlements "$TUNNEL_DIR/TgWsProxyTunnel.entitlements"
          echo "PacketTunnel extension compiled successfully."

      - name: Assemble app bundle
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_DIR="build/Payload/TgWsProxy.app"

          cp TgWsProxy/Resources/Info.plist "$APP_DIR/Info.plist"
          cp TgWsProxy/Resources/TgWsProxy.entitlements "$APP_DIR/TgWsProxy.entitlements"
          echo -n "APPL????" > "$APP_DIR/PkgInfo"
          cp TgWsProxy/Resources/AppIcon/*.png "$APP_DIR/"

          # Ad-hoc sign main app and extensions with entitlements
          codesign --force --sign - \
            --entitlements TgWsProxy/Resources/TgWsProxy.entitlements \
            "$APP_DIR/TgWsProxy"
          codesign --force --sign - \
            --entitlements TgWsProxy/Tunnel/TgWsProxyTunnel.entitlements \
            "$APP_DIR/PlugIns/TgWsProxyTunnel.appex/TgWsProxyTunnel"

          echo "App bundle structure:"
          find "$APP_DIR" -type f | sort

      - name: Create IPA
        working-directory: ios-app
        run: |
          set -euo pipefail
          cd build
          zip -r -q ../TgWsProxy-unsigned.ipa Payload/
          echo "IPA size: $(du -h ../TgWsProxy-unsigned.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: TgWsProxy-unsigned-ipa
          path: ios-app/TgWsProxy-unsigned.ipa

      - name: Publish IPA as rolling pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="ci-$(echo "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          IPA="ios-app/TgWsProxy-unsigned.ipa"

          # Delete previous release for this branch tag (if any), so the
          # download URL stays stable and small.
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          gh release create "$TAG" \
            "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CI build for $BRANCH" \
            --notes "Unsigned IPA built by CI from $GITHUB_SHA on branch \`$BRANCH\`. Sign with your own provisioning profile or Sideloadly / AltStore." \
            --prerelease
